name: Update public visitor count

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-visitor-count
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
      UMAMI_WEBSITE_ID: 503cabd6-53f9-453b-8d97-c8c85639f7c7
    steps:
      - name: Check out the homepage
        uses: actions/checkout@v5

      - name: Fetch the all-time visitor count
        shell: bash
        run: |
          if [ -z "$UMAMI_API_KEY" ]; then
            echo "UMAMI_API_KEY is not configured; leaving the public counter hidden."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          website_id = os.environ["UMAMI_WEBSITE_ID"]
          api_key = os.environ["UMAMI_API_KEY"]
          query = urllib.parse.urlencode({"startAt": 0, "endAt": int(time.time() * 1000)})
          url = f"https://api.umami.is/v1/websites/{website_id}/stats?{query}"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "Authorization": f"Bearer {api_key}",
                  "User-Agent": "JinboWen1019.github.io visitor counter",
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              stats = json.load(response)

          visitors = stats.get("visitors")
          if not isinstance(visitors, int) or visitors < 0:
              raise RuntimeError("Umami returned an invalid visitor count")

          output = {
              "visitors": visitors,
              "updatedAt": datetime.now(timezone.utc).isoformat(timespec="seconds"),
          }
          path = pathlib.Path("assets/data/visitor-count.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish the refreshed count
        shell: bash
        run: |
          if git diff --quiet -- assets/data/visitor-count.json; then
            echo "Visitor count has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/visitor-count.json
          git commit -m "Update public visitor count"
          git pull --rebase origin master
          git push origin HEAD:master
