name: Update public visitor count

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-visitor-count
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UMAMI_SHARE_SLUG: ${{ secrets.UMAMI_SHARE_SLUG }}
      UMAMI_WEBSITE_ID: 503cabd6-53f9-453b-8d97-c8c85639f7c7
    steps:
      - name: Check out the homepage
        uses: actions/checkout@v5

      - name: Fetch the all-time visitor count
        shell: bash
        run: |
          if [ -z "$UMAMI_SHARE_SLUG" ]; then
            echo "UMAMI_SHARE_SLUG is not configured; leaving the public counter hidden."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          expected_website_id = os.environ["UMAMI_WEBSITE_ID"]
          share_slug = os.environ["UMAMI_SHARE_SLUG"]
          api_base = "https://api.umami.is/v1/us"
          share_url = api_base + "/share/" + urllib.parse.quote(share_slug, safe="")
          share_request = urllib.request.Request(
              share_url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "JinboWen1019.github.io visitor counter",
              },
          )

          with urllib.request.urlopen(share_request, timeout=30) as response:
              share = json.load(response)

          website_id = share.get("websiteId")
          share_token = share.get("token")
          if website_id != expected_website_id or not isinstance(share_token, str):
              raise RuntimeError("Umami returned invalid share credentials")

          query = urllib.parse.urlencode({"startAt": 0, "endAt": int(time.time() * 1000)})
          url = f"{api_base}/websites/{website_id}/stats?{query}"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "JinboWen1019.github.io visitor counter",
                  "x-umami-share-token": share_token,
                  "x-umami-share-context": "1",
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              stats = json.load(response)

          visitors = stats.get("visitors")
          if not isinstance(visitors, int) or visitors < 0:
              raise RuntimeError("Umami returned an invalid visitor count")

          output = {
              "visitors": visitors,
              "updatedAt": datetime.now(timezone.utc).isoformat(timespec="seconds"),
          }
          path = pathlib.Path("assets/data/visitor-count.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish the refreshed count
        shell: bash
        run: |
          if git diff --quiet -- assets/data/visitor-count.json; then
            echo "Visitor count has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/visitor-count.json
          git commit -m "Update public visitor count"
          git pull --rebase origin master
          git push origin HEAD:master
